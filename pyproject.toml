[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portsight"
dynamic = ["version"]
description = "See who owns every local port: listeners, Docker publishes, Windows exclusions, and free ranges in one report."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Riley", email = "rfdpro@gmail.com" }]
keywords = [
    "ports",
    "netstat",
    "docker",
    "wsl2",
    "hyper-v",
    "excludedportrange",
    "cli",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "psutil>=5.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "build>=1.2",
    "pre-commit>=3.5",
]

[project.urls]
Homepage = "https://github.com/rfdpro/portsight"
Documentation = "https://github.com/rfdpro/portsight#readme"
Issues = "https://github.com/rfdpro/portsight/issues"
Changelog = "https://github.com/rfdpro/portsight/blob/main/CHANGELOG.md"

[project.scripts]
portsight = "portsight.cli:main"

[tool.setuptools.dynamic]
version = { attr = "portsight.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portsight = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["portsight"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", # ambiguous unicode in strings (intentional en-dashes in prose)
    "RUF002", # same, in docstrings
    "RUF003", # same, in comments
    "SIM108", # explicit if/else is often clearer than a long ternary
]
