name: Feature request
description: Suggest a new question portsight should answer
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out or do?
      description: Describe the situation, not just the flag you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Example command and output, if you have one in mind.
